name: Secrets scan

# Mouseflare is privacy-first and local-only — no credential should ever appear
# in this repo, so scan source AND git history on every push/PR. Runs the
# gitleaks CLI directly rather than gitleaks-action, which requires an org
# licence; the CLI is free and unencumbered. Config + allowlist live in
# .gitleaks.toml.
#
# Unlike our private repos this runs on GitHub-hosted runners: the repo is
# public, and fork PRs must never execute on self-hosted hardware.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time. NOT cancelled on main: this is the scan that would
# catch a leaked key reaching the default branch, and a merge whose scan was
# cancelled by the next merge is a merge nobody scanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit, not just the tip —
          # a secret committed then removed is exactly what we want to catch.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `git` scans the full commit history; --redact keeps any hit out of the
      # public log. Non-zero exit (a leak) fails the job. The SARIF report is
      # uploaded for triage even on failure.
      - name: Scan history + working tree
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 7
          if-no-files-found: ignore
