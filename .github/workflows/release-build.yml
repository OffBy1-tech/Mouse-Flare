name: Build & publish distributables

# Two channels (docs/auto-update-spec.md):
#  - push to main   -> rolling `latest` prerelease (dev channel, unsigned)
#  - push tag v*    -> minisign-signed DRAFT release; a maintainer clicking
#    Publish is the promotion moment that makes it the stable release the
#    auto-updater will follow.
# Hosted runners (not self-hosted) are deliberate: this is a public repo.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One publish per ref at a time; never cancel a run mid-upload so a release is
# always a complete, matching set of artifacts + checksums.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS app (universal)
    runs-on: macos-latest
    outputs:
      # Tells the publish job which Gatekeeper story belongs in the release notes.
      signing-mode: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      # Signing degrades gracefully rather than failing the release: with no
      # secrets configured (forks, or any run before the Developer ID cert
      # exists) the app is still ad-hoc signed exactly as it was, and the notes
      # keep the quarantine workaround. Secret names: src/native/macos/README.md.
      - name: Detect signing credentials
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            MODE=adhoc
          elif [ -n "$NOTARY_KEY_P8" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
            MODE=notarized
          else
            MODE=developer-id
          fi
          echo "Signing mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Two single-arch builds joined with lipo (works with bare Command Line
      # Tools too, so the recipe can be rehearsed locally — `swift build
      # --arch a --arch b` requires full Xcode).
      - name: Build universal binary
        working-directory: src/native/macos
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx13.0
          swift build -c release --triple x86_64-apple-macosx13.0

      - name: Assemble Mouseflare.app
        working-directory: src/native/macos
        run: |
          set -euo pipefail
          # Stable tag builds get the tag's version; dev builds are 0.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "Stamping version: $VERSION"

          APP="dist/Mouseflare.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          lipo -create \
            .build/arm64-apple-macosx/release/Mouseflare \
            .build/x86_64-apple-macosx/release/Mouseflare \
            -output "$APP/Contents/MacOS/Mouseflare"
          lipo -archs "$APP/Contents/MacOS/Mouseflare"

          # AppLogo resolves Contents/Resources/app-logo.png directly (the app
          # deliberately avoids Bundle.module, whose swift-build accessor only
          # knows the app root and the CI machine's build path)
          cp Sources/Resources/app-logo.png "$APP/Contents/Resources/app-logo.png"

          # Finder/Dock icon: build Mouseflare.icns from the padded 1024px
          # master (packaging/AppIcon-1024.png, logo at 82% on transparency
          # to match the macOS icon grid)
          mkdir -p Mouseflare.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" packaging/AppIcon-1024.png --out "Mouseflare.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size*2))" "$((size*2))" packaging/AppIcon-1024.png --out "Mouseflare.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns Mouseflare.iconset -o "$APP/Contents/Resources/Mouseflare.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Mouseflare</string>
            <key>CFBundleDisplayName</key><string>Mouseflare</string>
            <key>CFBundleIdentifier</key><string>com.offby1.mouseflare</string>
            <key>CFBundleExecutable</key><string>Mouseflare</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>Mouseflare</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      # Guards the failure that shipped in 0.8.0: Bundle.module's SwiftPM
      # accessor aborts when the resource bundle is missing, and it only knows
      # the .app root plus the build machine's absolute build path — so the
      # packaged app crashed everywhere except the machine that built it.
      - name: Ban Bundle.module in the macOS target
        working-directory: src/native/macos
        run: |
          set -euo pipefail
          if grep -rn --include='*.swift' 'Bundle\.module' Sources | grep -vE ':[[:space:]]*(///|//)'; then
            echo "::error::Bundle.module aborts when the resource bundle is absent from the packaged .app. Embed the resource or resolve its path by hand (see AppLogo / NavIcons)."
            exit 1
          fi
          echo "No Bundle.module usage."

      # The private key lives only in a throwaway keychain under RUNNER_TEMP,
      # never the login keychain, and is deleted by the cleanup step below.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode != 'adhoc'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mouseflare-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$P12"' EXIT

          echo "$CERT_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Without this, codesign blocks on a UI prompt for keychain access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # Sign by SHA-1 hash, not by name: unambiguous even if the keychain
          # ever holds more than one Developer ID identity.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported .p12. A Mac Development or Developer ID Installer certificate will not do."
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application'
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Code-sign Mouseflare.app
        working-directory: src/native/macos
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          APP="dist/Mouseflare.app"

          if [ "$SIGNING_MODE" = "adhoc" ]; then
            echo "No Developer ID secrets — ad-hoc signing for local execution only."
            codesign --force --deep --sign - "$APP"
          else
            # The bundle holds no nested code (no frameworks, no helpers), so
            # signing the bundle covers its one Mach-O. --options runtime is the
            # hardened runtime, mandatory for notarization; --timestamp gets the
            # secure timestamp that keeps the signature valid past cert expiry.
            # No entitlements file: the app is unsandboxed, and Accessibility
            # (AXIsProcessTrustedWithOptions) is a TCC grant, not an entitlement.
            codesign --force --options runtime --timestamp \
              --sign "$SIGNING_IDENTITY" "$APP"
          fi

          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|flags|Identifier' || true

      # Launches the assembled .app the way a user would and opens Settings —
      # the code path that trapped in 0.8.0. swift build alone cannot catch it,
      # because the build tree still contains the resource bundle. Runs after
      # signing so it exercises the bundle that actually ships, hardened
      # runtime included.
      - name: Smoke-test the packaged app (opens Settings)
        working-directory: src/native/macos
        run: |
          set -uo pipefail
          BIN="dist/Mouseflare.app/Contents/MacOS/Mouseflare"
          "$BIN" --settings > smoke-out.txt 2> smoke-err.txt &
          PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            echo "Settings opened and the app stayed alive."
            exit 0
          fi
          wait "$PID"; CODE=$?
          echo "App exited early with code $CODE"
          sed -n '1,40p' smoke-err.txt || true
          # Swift traps (SIGTRAP/SIGABRT) and explicit fatal errors are real
          # crashes; anything else may be a headless-runner quirk, so warn only.
          if [ "$CODE" -ge 128 ] || grep -q "Fatal error" smoke-err.txt; then
            echo "::error::Packaged app crashed while opening Settings (exit $CODE)."
            exit 1
          fi
          echo "::warning::App exited early (code $CODE) without a crash signature; not failing the release."

      # Stapling matters for the updater: it embeds the notarization ticket in
      # the bundle, so an app unzipped by the in-app updater validates without
      # a round trip to Apple.
      - name: Notarize & staple
        if: steps.signing.outputs.mode == 'notarized'
        working-directory: src/native/macos
        env:
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="dist/Mouseflare.app"
          KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$KEY"' EXIT
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY"

          # ditto, not zip: it is the only archiver that preserves the symlinks
          # and extended attributes a signed bundle depends on.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"

          set +e
          OUT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json)"
          RC=$?
          set -e
          echo "$OUT"

          SUBMISSION_ID="$(echo "$OUT" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
          if [ "$RC" -ne 0 ]; then
            # The rejection reasons live in the log, not the submit output.
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            fi
            echo "::error::Notarization failed (see the log above)."
            exit 1
          fi

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          # What a user's Mac will conclude: expect "source=Notarized Developer ID".
          spctl --assess --type exec -vvv "$APP"

      - name: Package Mouseflare-macOS.zip
        working-directory: src/native/macos
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Mouseflare.app "$GITHUB_WORKSPACE/Mouseflare-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Mouseflare-macOS
          path: Mouseflare-macOS.zip
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always()
        run: |
          set -uo pipefail
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" || true

  build-windows:
    name: Windows app (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          Write-Host "Stamping version: $version"
          dotnet publish src/native/windows/Mouseflare.csproj -c Release -o publish -p:Version=$version

      - name: Zip distributable
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Mouseflare-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mouseflare-Windows
          path: Mouseflare-Windows.zip
          if-no-files-found: error

  publish:
    name: Checksums & release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Decides which Gatekeeper instructions the release notes carry.
      MACOS_SIGNING_MODE: ${{ needs.build-macos.outputs.signing-mode }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify preset data is in sync
        run: node scripts/generate-fx-presets.mjs --check

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Gatekeeper wording depends on how the app was actually signed this run
      # — build-macos degrades to ad-hoc when the secrets are absent. Computed
      # once here; both release steps below consume $MAC_GATEKEEPER.
      - name: Compose the macOS install note
        run: |
          set -euo pipefail
          case "${MACOS_SIGNING_MODE:-adhoc}" in
            notarized)
              NOTE="Signed with a Developer ID certificate and notarized by Apple — unzip and open, no Gatekeeper workaround needed." ;;
            developer-id)
              NOTE="Developer ID signed but not notarized, so Gatekeeper blocks the first launch: \`xattr -dr com.apple.quarantine Mouseflare.app && open Mouseflare.app\` (or System Settings → Privacy & Security → Open Anyway)." ;;
            *)
              NOTE="Not notarized yet, so Gatekeeper blocks the first launch: \`xattr -dr com.apple.quarantine Mouseflare.app && open Mouseflare.app\` (or System Settings → Privacy & Security → Open Anyway). Needed once per download; the app's own auto-updates are not quarantined." ;;
          esac
          echo "macOS note: $NOTE"
          echo "MAC_GATEKEEPER=$NOTE" >> "$GITHUB_ENV"

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum Mouseflare-macOS.zip Mouseflare-Windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ---- Stable channel: tag push -> minisign-signed DRAFT release ----
      # Publishing the draft is the maintainer's promotion act; the release
      # becomes GitHub's `releases/latest` (what the auto-updater follows)
      # only at that moment.
      - name: Sign artifacts & create draft release (stable tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q minisign

          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          trap 'rm -f minisign.key' EXIT

          minisign -S -s minisign.key -t "Mouseflare ${GITHUB_REF_NAME}" -m Mouseflare-macOS.zip
          minisign -S -s minisign.key -t "Mouseflare ${GITHUB_REF_NAME}" -m Mouseflare-Windows.zip

          # Verify with the committed public key before releasing anything —
          # catches a key/secret mismatch at build time, not at user time.
          minisign -Vm Mouseflare-macOS.zip -p minisign.pub
          minisign -Vm Mouseflare-Windows.zip -p minisign.pub

          # "What's new" comes from the annotated tag's message (git tag -a vX.Y.Z
          # -m "Title" -m "- bullet"). Re-fetch the tag explicitly: checkout can
          # leave it peeled to the commit, which would drop the annotation.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true

          {
            echo "Stable release ${GITHUB_REF_NAME} (commit ${GITHUB_SHA})."
            echo
            if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" = "tag" ]; then
              echo "## What's new"
              echo
              # Tag annotation verbatim, minus any PGP signature block
              git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d'
              echo
            fi
            echo "## Verify your download"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Artifacts are minisign-signed ([public key](https://github.com/OffBy1-tech/Mouse-Flare/blob/main/minisign.pub)):"
            echo
            echo '```'
            echo "minisign -Vm Mouseflare-macOS.zip -P RWQV1L6pDRSw69B18smY6ny2RZpAecKvPvS48ImhiukQjEmN8lAqP3Mw"
            echo '```'
            echo
            echo "- **macOS** (universal, macOS 13+): $MAC_GATEKEEPER"
            echo "- **Windows**: requires the free [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)."
          } > notes.md

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Mouseflare $GITHUB_REF_NAME" \
            --notes-file notes.md \
            Mouseflare-macOS.zip Mouseflare-macOS.zip.minisig \
            Mouseflare-Windows.zip Mouseflare-Windows.zip.minisig \
            SHA256SUMS.txt

      # ---- Dev channel: push to main -> rolling `latest` prerelease ----
      - name: Publish rolling `latest` prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          {
            echo "Automated build of \`main\` @ ${GITHUB_SHA}."
            echo
            echo "## Verify your download"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "- **macOS**: \`shasum -a 256 -c SHA256SUMS.txt\` (with the zip in the same folder). $MAC_GATEKEEPER"
            echo "- **Windows**: \`certutil -hashfile Mouseflare-Windows.zip SHA256\` and compare against the value above. Requires the free [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)."
          } > notes.md
          # Recreate the release so tag, assets, and checksums always refer to this commit
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest development build" \
            --notes-file notes.md \
            Mouseflare-macOS.zip Mouseflare-Windows.zip SHA256SUMS.txt
