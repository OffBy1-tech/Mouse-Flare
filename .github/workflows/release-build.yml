name: Build & publish distributables

# Two channels (docs/auto-update-spec.md):
#  - push to main   -> rolling `latest` prerelease (dev channel, unsigned)
#  - push tag v*    -> minisign-signed DRAFT release; a maintainer clicking
#    Publish is the promotion moment that makes it the stable release the
#    auto-updater will follow.
# Hosted runners (not self-hosted) are deliberate: this is a public repo.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One publish per ref at a time; never cancel a run mid-upload so a release is
# always a complete, matching set of artifacts + checksums.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Two single-arch builds joined with lipo (works with bare Command Line
      # Tools too, so the recipe can be rehearsed locally — `swift build
      # --arch a --arch b` requires full Xcode).
      - name: Build universal binary
        working-directory: src/native/macos
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx13.0
          swift build -c release --triple x86_64-apple-macosx13.0

      - name: Assemble Mouseflare.app
        working-directory: src/native/macos
        run: |
          set -euo pipefail
          # Stable tag builds get the tag's version; dev builds are 0.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "Stamping version: $VERSION"

          APP="dist/Mouseflare.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          lipo -create \
            .build/arm64-apple-macosx/release/Mouseflare \
            .build/x86_64-apple-macosx/release/Mouseflare \
            -output "$APP/Contents/MacOS/Mouseflare"
          lipo -archs "$APP/Contents/MacOS/Mouseflare"

          # AppLogo resolves Contents/Resources/app-logo.png directly (the app
          # deliberately avoids Bundle.module, whose swift-build accessor only
          # knows the app root and the CI machine's build path)
          cp Sources/Resources/app-logo.png "$APP/Contents/Resources/app-logo.png"

          # Finder/Dock icon: build Mouseflare.icns from the padded 1024px
          # master (packaging/AppIcon-1024.png, logo at 82% on transparency
          # to match the macOS icon grid)
          mkdir -p Mouseflare.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" packaging/AppIcon-1024.png --out "Mouseflare.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size*2))" "$((size*2))" packaging/AppIcon-1024.png --out "Mouseflare.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns Mouseflare.iconset -o "$APP/Contents/Resources/Mouseflare.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Mouseflare</string>
            <key>CFBundleDisplayName</key><string>Mouseflare</string>
            <key>CFBundleIdentifier</key><string>com.offby1.mouseflare</string>
            <key>CFBundleExecutable</key><string>Mouseflare</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>Mouseflare</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/Mouseflare-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Mouseflare-macOS
          path: Mouseflare-macOS.zip
          if-no-files-found: error

  build-windows:
    name: Windows app (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          Write-Host "Stamping version: $version"
          dotnet publish src/native/windows/Mouseflare.csproj -c Release -o publish -p:Version=$version

      - name: Zip distributable
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Mouseflare-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mouseflare-Windows
          path: Mouseflare-Windows.zip
          if-no-files-found: error

  publish:
    name: Checksums & release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum Mouseflare-macOS.zip Mouseflare-Windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ---- Stable channel: tag push -> minisign-signed DRAFT release ----
      # Publishing the draft is the maintainer's promotion act; the release
      # becomes GitHub's `releases/latest` (what the auto-updater follows)
      # only at that moment.
      - name: Sign artifacts & create draft release (stable tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q minisign

          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          trap 'rm -f minisign.key' EXIT

          minisign -S -s minisign.key -t "Mouseflare ${GITHUB_REF_NAME}" -m Mouseflare-macOS.zip
          minisign -S -s minisign.key -t "Mouseflare ${GITHUB_REF_NAME}" -m Mouseflare-Windows.zip

          # Verify with the committed public key before releasing anything —
          # catches a key/secret mismatch at build time, not at user time.
          minisign -Vm Mouseflare-macOS.zip -p minisign.pub
          minisign -Vm Mouseflare-Windows.zip -p minisign.pub

          # "What's new" comes from the annotated tag's message (git tag -a vX.Y.Z
          # -m "Title" -m "- bullet"). Re-fetch the tag explicitly: checkout can
          # leave it peeled to the commit, which would drop the annotation.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true

          {
            echo "Stable release ${GITHUB_REF_NAME} (commit ${GITHUB_SHA})."
            echo
            if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" = "tag" ]; then
              echo "## What's new"
              echo
              # Tag annotation verbatim, minus any PGP signature block
              git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d'
              echo
            fi
            echo "## Verify your download"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Artifacts are minisign-signed ([public key](https://github.com/OffBy1-tech/Mouse-Flare/blob/main/minisign.pub)):"
            echo
            echo '```'
            echo "minisign -Vm Mouseflare-macOS.zip -P RWQV1L6pDRSw69B18smY6ny2RZpAecKvPvS48ImhiukQjEmN8lAqP3Mw"
            echo '```'
            echo
            echo "- **macOS** (universal, macOS 13+): not notarized yet, so Gatekeeper blocks the first launch. Unzip, then: \`xattr -dr com.apple.quarantine Mouseflare.app && open Mouseflare.app\` (or use System Settings → Privacy & Security → Open Anyway). Needed once per download; the app's own auto-updates are not quarantined."
            echo "- **Windows**: requires the free [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)."
          } > notes.md

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Mouseflare $GITHUB_REF_NAME" \
            --notes-file notes.md \
            Mouseflare-macOS.zip Mouseflare-macOS.zip.minisig \
            Mouseflare-Windows.zip Mouseflare-Windows.zip.minisig \
            SHA256SUMS.txt

      # ---- Dev channel: push to main -> rolling `latest` prerelease ----
      - name: Publish rolling `latest` prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          {
            echo "Automated build of \`main\` @ ${GITHUB_SHA}."
            echo
            echo "## Verify your download"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "- **macOS**: \`shasum -a 256 -c SHA256SUMS.txt\` (with the zip in the same folder). Not notarized yet, so Gatekeeper blocks the first launch: \`xattr -dr com.apple.quarantine Mouseflare.app && open Mouseflare.app\` (or System Settings → Privacy & Security → Open Anyway). Needed once per download; the app's own auto-updates are not quarantined."
            echo "- **Windows**: \`certutil -hashfile Mouseflare-Windows.zip SHA256\` and compare against the value above. Requires the free [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)."
          } > notes.md
          # Recreate the release so tag, assets, and checksums always refer to this commit
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest development build" \
            --notes-file notes.md \
            Mouseflare-macOS.zip Mouseflare-Windows.zip SHA256SUMS.txt
